<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schindler's List</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main id="app">

    <section id="home" class="screen active">
      <img src="start.png" alt="Schindler's List - pagina iniziale" class="full-slide" />
      <button class="start-btn" onclick="showScreen('menu')">INIZIA</button>
    </section>

    <section id="menu" class="screen menu-screen">
      <h1>SCHINDLER'S LIST</h1>

     <div class="grid-buttons">

    <button onclick="showScreen('music')">
        <img src="icon_music.png" alt="Musica">
    </button>

    <button onclick="showScreen('book')">
        <img src="icon_book.png" alt="Libro">
    </button>

    <button onclick="showScreen('nazism')">
        <img src="icon_nazism.png" alt="Nazismo">
    </button>

    <button onclick="showScreen('racism')">
        <img src="icon_racism.png" alt="Razzismo">
    </button>

    <button onclick="showScreen('poem')">
        <img src="icon_poem.png" alt="Poesia">
    </button>

    <button onclick="showScreen('talmud')">
        ✡️
    </button>

    <button onclick="showScreen('lise')">
        <img src="icon_lise.png" alt="Lise Meitner">
    </button>

    <button onclick="showScreen('fission')">
        <img src="icon_fission.png" alt="Fissione">
    </button>

    <button onclick="showScreen('guernica')">
        <img src="icon_guernica.png" alt="Guernica">
    </button>

</div>

      <button class="arrow left" onclick="showScreen('home')">‹</button>
      <button class="arrow right" onclick="showScreen('final')">›</button>
    </section>

    <section id="music" class="screen content-screen">
      <img src="music.png" class="full-slide" alt="Brano al piano" />
      <button class="back" onclick="showScreen('menu')">‹</button>
    </section>

    <section id="book" class="screen content-screen">
      <img src="book.png" class="full-slide" alt="Libro Schindler's List" />
      <button class="back" onclick="showScreen('menu')">‹</button>
    </section>

    <section id="nazism" class="screen content-screen">
      <img src="nazism.png" class="full-slide" alt="Nazismo" />
      <button class="back" onclick="showScreen('menu')">‹</button>
    </section>

    <section id="racism" class="screen content-screen">
      <img src="racism.png" class="full-slide" alt="Razzismo" />
      <button class="back" onclick="showScreen('menu')">‹</button>
    </section>

    <section id="poesia" class="screen content-screen">
      <img src="poesia.png" class="full-slide" alt="Poesia" />
      <button class="back" onclick="showScreen('menu')">‹</button>
    </section>

    <section id="talmud" class="screen content-screen">
      <img src="talmud.png" class="full-slide" alt="Talmud" />
      <button class="back" onclick="showScreen('menu')">‹</button>
    </section>

    <section id="lise" class="screen content-screen">
      <img src="lise.png" class="full-slide" alt="Lise Meitner" />
      <button class="back" onclick="showScreen('menu')">‹</button>
    </section>

    <section id="fission" class="screen content-screen">
      <img src="fission.png" class="full-slide" alt="Fissione nucleare" />
      <button class="back" onclick="showScreen('menu')">‹</button>
    </section>

    <section id="guernica" class="screen content-screen">
      <img src="guernica.png" class="full-slide" alt="Guernica" />
      <button class="back" onclick="showScreen('menu')">‹</button>
    </section>

    <section id="final" class="screen content-screen">
      <img src="final.png" class="full-slide" alt="Slide finale" />
      <button class="back" onclick="showScreen('menu')">‹</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
